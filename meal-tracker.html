
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daily Meal Orders</title>

  <style>
    body {
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #22c1c3, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      padding: 20px;
      border-radius: 22px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.25);
    }

    h1 {
      font-size: 22px;
      text-align: center;
      color: #1e3a8a;
      margin: 0;
    }

    .hint {
      text-align: center;
      font-size: 13px;
      color: #475569;
      margin-top: 6px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: 13px;
      font-weight: 600;
      color: #334155;
    }

    input, select, textarea {
      width: 100%;
      padding: 12px;
      margin-top: 4px;
      border-radius: 12px;
      border: 1px solid #cbd5e1;
      font-size: 14px;
      background: #f8fafc;
    }

    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      font-size: 15px;
      font-weight: 700;
      background: linear-gradient(135deg, #2563eb, #1e40af);
      color: white;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin: 18px 0;
    }

    .tab {
      flex: 1;
      padding: 12px;
      text-align: center;
      border-radius: 14px;
      background: #e5e7eb;
      font-weight: 600;
      cursor: pointer;
    }

    .tab.active {
      background: #2563eb;
      color: white;
    }

    .hidden { display: none; }

    .card {
      position: relative;
      background: #f8fafc;
      border-radius: 16px;
      padding: 14px;
      margin-top: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }

    .card-row {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
      font-size: 14px;
    }

    .price {
      font-weight: 700;
      color: #1e40af;
    }

    .delete-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      background: transparent;
      border: none;
      font-size: 18px;
      font-weight: 700;
      color: #64748b;
      cursor: pointer;
    }

    .delete-btn:hover {
      color: #dc2626;
    }

    .summary {
      margin-top: 18px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      padding: 16px;
      border-radius: 18px;
      font-weight: 700;
      font-size: 14px;
      color: #1e3a8a;
    }

    .summary div {
      display: flex;
      justify-content: space-between;
      margin-top: 6px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>
    Meal Orders –
    <input id="customer"
           placeholder="Customer name"
           style="border:none;border-bottom:1px solid #cbd5e1;width:140px;background:transparent;">
  </h1>

  <div class="hint">Veg / Non‑Veg = 7 AED • Special = 10 AED</div>

  <div class="tabs">
    <div class="tab active" onclick="showTab('orders')">Orders</div>
    <div class="tab" onclick="showTab('payments')">Payments</div>
  </div>

  <div id="orders">
    <label>Date</label>
    <input type="date" id="date">

    <label>Meal Type</label>
    <select id="meal">
      <option value="7">Veg</option>
      <option value="7">Non‑Veg</option>
      <option value="10">Special Item</option>
    </select>

    <label>Meal Time</label>
    <select id="time">
      <option>Lunch</option>
      <option>Dinner</option>
    </select>

    <label>Notes</label>
    <textarea id="notes" rows="2"></textarea>

    <button onclick="addOrder()">Add Order</button>
    <div id="cards"></div>
  </div>

  <div id="payments" class="hidden">
    <label>Paid Amount (AED)</label>
    <input type="number" id="paidInput">
    <button onclick="addPayment()">Add Payment</button>
  </div>

  <div class="summary">
    <div><span>Total Items</span><span id="totalMeals">0</span></div>
    <div><span>Total</span><span><span id="gross">0</span> AED</span></div>
    <div><span>Paid</span><span><span id="paid">0</span> AED</span></div>
    <div><span>Balance</span><span><span id="balance">0</span> AED</span></div>
  </div>
</div>

<script>
  let state = JSON.parse(localStorage.getItem("mealApp")) || {
    customer: "",
    items: [],
    gross: 0,
    paid: 0
  };

  const cards = document.getElementById("cards");
  const customer = document.getElementById("customer");

  function save() {
    localStorage.setItem("mealApp", JSON.stringify(state));
  }

  customer.value = state.customer;
  customer.oninput = () => {
    state.customer = customer.value;
    save();
  };

  function showTab(tab) {
    document.getElementById("orders").classList.add("hidden");
    document.getElementById("payments").classList.add("hidden");
    document.getElementById(tab).classList.remove("hidden");
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    event.target.classList.add("active");
  }

  function render() {
    cards.innerHTML = "";
    state.items.forEach((item, index) => {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML = `
        <button class="delete-btn" onclick="removeItem(${index})">×</button>
        <div class="card-row"><strong>${item.name}</strong><span class="price">${item.price} AED</span></div>
        <div class="card-row"><span>${item.time}</span><span>${item.date}</span></div>
        ${item.notes ? `<div class="card-row"><em>${item.notes}</em></div>` : ""}
      `;
      cards.appendChild(card);
    });

    totalMeals.innerText = state.items.length;
    gross.innerText = state.gross;
    paid.innerText = state.paid;
    balance.innerText = state.gross - state.paid;
  }

  function addOrder() {
    if (!date.value) return alert("Select a date");

    const price = Number(meal.value);
    state.items.push({
      name: meal.options[meal.selectedIndex].text,
      price,
      date: date.value,
      time: time.value,
      notes: notes.value
    });

    state.gross += price;
    save();
    render();
    date.value = "";
    notes.value = "";
  }

  function removeItem(index) {
    state.gross -= state.items[index].price;
    state.items.splice(index, 1);
    save();
    render();
  }

  function addPayment() {
    const v = Number(paidInput.value);
    if (!v) return;
    state.paid += v;
    paidInput.value = "";
    save();
    render();
  }

  render();
</script>

</body>
</html>
